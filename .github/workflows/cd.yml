name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: Check before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run project checks
        run: make check

  publish:
    name: Build and push to GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ferhadb/softwarefinalproject:latest
            ghcr.io/ferhadb/softwarefinalproject:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ferhadb/SoftwareFinalProject
            org.opencontainers.image.revision=${{ github.sha }}