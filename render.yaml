# Render Blueprint: New + -> Blueprint -> pick this repo. Builds the Dockerfile, creates Postgres.
services:
  - type: web
    name: spendsmart
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true # redeploy on every push to the connected branch (main)
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: CATEGORIZER
        value: rules
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spendsmart-db
          property: connectionString

databases:
  - name: spendsmart-db
    plan: free
